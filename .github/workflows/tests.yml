name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pgserver psycopg2-binary mini-racer playwright
          python -m playwright install --with-deps chromium
      - name: Test database schema and API
        run: python supabase/test_schema.py supabase/schema.sql
      - name: Test battle calculations
        run: python tests/test_battle.py
      - name: Test game and battle UI
        run: python tests/ui_mock.py
      - name: Test player and admin flows
        run: python tests/ui_flows.py
